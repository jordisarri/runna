        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #0d0b09;
            overflow: hidden;
            touch-action: none;
        }
        /* El contenidor ocupa tota la pantalla del dispositiu i Phaser hi centra el llenç 9:16 (720×1280) amb el mateix espai a dalt i a baix */
        #joc {
            position: fixed;
            top: 0; right: 0; bottom: 0; left: 0;
        }
    </style>
    <!-- Tipografies al nostre servidor (eines/baixa_tipografies.py): el joc no demana res a Google -->
    <link rel="stylesheet" href="assets/fonts/fonts.css">
    <!-- Phaser va amb el joc (així no depèn de cap servidor extern); si el fitxer local fallés, es prova el CDN -->
    <script src="js/lib/phaser.min.js?v=3.80.1"></script>
    <script>if (typeof Phaser === 'undefined') document.write('<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"><\/script>');</script>

<body>
    <pre id="errors" style="white-space:pre-wrap;word-break:break-all;position:fixed;left:0;right:0;bottom:0;margin:0;padding:8px;max-height:40%;overflow:auto;background:#300;color:#fcc;font:12px monospace;z-index:9;display:none"></pre>
    <script>
        // Si alguna cosa falla en carregar, es veu a la pantalla (en comptes de quedar-se "Carregant...")
        window.addEventListener('error', e => {
            const el = document.getElementById('errors');
            el.style.display = 'block';
            if (e.target && e.target !== window && e.target.src) {      // un fitxer (script) no s'ha pogut carregar
                el.textContent += "NO S'HA POGUT CARREGAR: " + e.target.src + "\n";
                // Una connexió que es talla a mig carregar és el més normal: es torna a provar sol UNA vegada (i, si no, queda el botó)
                let jaProvat = false; try { jaProvat = sessionStorage.getItem('runna_reintent') === '1'; sessionStorage.setItem('runna_reintent', '1'); } catch (x) { jaProvat = true; }
                if (!jaProvat) setTimeout(() => location.reload(), 1200);
                else if (!document.getElementById('reintenta')) {
                    const b = document.createElement('button'); b.id = 'reintenta'; b.textContent = 'Torna-ho a provar';
                    b.style.cssText = 'display:block;margin:10px auto 0;padding:12px 24px;font:20px sans-serif;border-radius:8px;border:2px solid #d4af37;background:#1a120b;color:#fff';
                    b.onclick = () => { try { sessionStorage.removeItem('runna_reintent'); } catch (x) { } location.reload(); };
                    el.appendChild(b);
                }
            } else {
                el.textContent += (e.filename || '').split('/').pop() + ':' + e.lineno + '  ' + e.message + "\n";
            }
        }, true);
    </script>
    <div id="joc"></div>

    <script>
        // Service worker: només amb http(s) (no obrint el fitxer directament) i sense fer fallar el joc si no pot ser
        window.addEventListener('load', () => { try { if (typeof game !== 'undefined') sessionStorage.removeItem('runna_reintent'); } catch (e) { } });
        if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
            window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => { /* sense service worker: el joc va igual */ }); });
        }
    </script>
