<body>
    <pre id="errors" style="position:fixed;left:0;right:0;bottom:0;margin:0;padding:8px;max-height:40%;overflow:auto;background:#300;color:#fcc;font:12px monospace;z-index:9;display:none"></pre>
    <script>
        // Si alguna cosa falla en carregar, es veu a la pantalla (en comptes de quedar-se "Carregant...")
        window.addEventListener('error', e => {
            const el = document.getElementById('errors');
            el.style.display = 'block';
            if (e.target && e.target !== window && e.target.src) {      // un fitxer (script) no s'ha pogut carregar
                el.textContent += "NO S'HA POGUT CARREGAR: " + e.target.src + "\n";
            } else {
                el.textContent += (e.filename || '').split('/').pop() + ':' + e.lineno + '  ' + e.message + "\n";
            }
        }, true);
    </script>
    <div id="joc"></div>
