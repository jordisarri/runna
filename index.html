<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Runna: l'espasa del Miracle</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #0d0b09;
            overflow: hidden;
            touch-action: none;
        }
        /* El joc ocupa l'àrea visible (sense la barra del navegador ni el notch); l'alçada del llenç s'adapta a la seva proporció (js/ui.js) */
        #joc {
            position: fixed;
            top: env(safe-area-inset-top, 0px);
            right: env(safe-area-inset-right, 0px);
            bottom: env(safe-area-inset-bottom, 0px);
            left: env(safe-area-inset-left, 0px);
        }
        @supports (height: 100dvh) {
            #joc {
                bottom: auto;
                height: calc(100dvh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
            }
        }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Cinzel+Decorative:wght@700;900&family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
    <!-- Phaser va amb el joc (així no depèn de cap servidor extern); si el fitxer local fallés, es prova el CDN -->
    <script src="js/lib/phaser.min.js?v=3.80.1"></script>
    <script>if (typeof Phaser === 'undefined') document.write('<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"><\/script>');</script>
</head>
<body>
    <pre id="errors" style="position:fixed;left:0;right:0;bottom:0;margin:0;padding:8px;max-height:40%;overflow:auto;background:#300;color:#fcc;font:12px monospace;z-index:9;display:none"></pre>
    <script>
        // Si alguna cosa falla en carregar, es veu a la pantalla (en comptes de quedar-se "Carregant...")
        window.addEventListener('error', e => {
            const el = document.getElementById('errors');
            el.style.display = 'block';
            if (e.target && e.target !== window && e.target.src) {      // un fitxer (script) no s'ha pogut carregar
                el.textContent += "NO S'HA POGUT CARREGAR: " + e.target.src + "\n";
            } else {
                el.textContent += (e.filename || '').split('/').pop() + ':' + e.lineno + '  ' + e.message + "\n";
            }
        }, true);
    </script>
    <div id="joc"></div>
