name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  proves:
    name: Proves abans de publicar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Sintaxi de tot el codi de js/
        run: |
          fallats=0
          for f in $(find js -name '*.js'); do node --check "$f" || fallats=1; done
          [ "$fallats" = 0 ]
      - name: Prova de la progressió de la història
        run: node eines/prova_progres.js
      - name: Textos numerats (cap conversa sense classificar)
        run: |
          python3 eines/fer_textos.py | tee sortida_textos.txt
          if grep -qi 'sense classificar' sortida_textos.txt; then echo 'ERROR: hi ha converses sense classificar: afegeix-les a SECCIONS d eines/fer_textos.py'; exit 1; fi

  deploy:
    needs: proves
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare distribution
        run: |
          mkdir dist
          cp index.html dist/
          cp -r assets dist/
          cp -r js dist/
          [ -d proves ] && cp -r proves dist/ || true      # prototips fora del joc (p. ex. proves/pingpong/)
          [ -f manifest.json ] && cp manifest.json dist/ || true
          [ -f sw.js ] && cp sw.js dist/ || true

      - name: Garantir que art/ i production/ MAI es publiquen
        run: |
          rm -rf dist/art dist/production
          if [ -e dist/art ] || [ -e dist/production ]; then echo 'ERROR: art/ o production/ a dist'; exit 1; fi

      - name: Mida del que es publica (sense art/)
        run: |
          du -sh dist
          ls dist

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 300000

